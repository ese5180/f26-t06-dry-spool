# DrySpool uses its own ECDSA-P256 root-of-trust key.
# The private key is intentionally ignored by Git and must be distributed to
# teammates through a secure out-of-band channel.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${APPLICATION_CONFIG_DIR}/keys/dryspool-signing.pem"
