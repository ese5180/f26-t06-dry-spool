sample:
  name: DrySpool Wi-Fi nRF Cloud FOTA firmware
tests:
  dryspool.wifi.coap.fota:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp/ns
