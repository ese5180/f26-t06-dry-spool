# Note: even when using Protected Storage, credentials are still retrieved into insecure
# memory when in use.
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y
## TF-M: keep IPC mode (default) for the MQTT build. Enable MM-IOVEC to save RAM.
CONFIG_TFM_PSA_FRAMEWORK_HAS_MM_IOVEC=y

CONFIG_TFM_CRYPTO_ASYM_SIGN_MODULE_ENABLED=y

# Use NVS for settings
CONFIG_NVS=y

# Enable LTO to save flash memory (required for CoAP overlay which would otherwise overflow)
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

#NRF70 specific configuration
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NRF70_SKIP_LOCAL_ADMIN_MAC=y

# Keep crash data in a dedicated internal-flash partition. A RAM-backed dump
# large enough for this application would exceed the nRF5340's available RAM.
CONFIG_MEMFAULT_NCS_INTERNAL_FLASH_BACKED_COREDUMP=y
CONFIG_MBEDTLS_HEAP_SIZE=49152

# Cut flash. Needed in order to fit into application image slots
CONFIG_NET_SHELL=n

# Not enough RAM for the Memfault buttons thread
CONFIG_SAMPLE_MEMFAULT_BUTTONS=n
