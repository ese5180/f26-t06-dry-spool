CONFIG_DRYSPOOL_BLE_SETUP=y

# Nordic's setup protocol reports IPv4 and the product setup uses DHCPv4.
# Keep the shared, signed MCUboot slot layout when adding the BLE host.
CONFIG_NET_IPV6=n
CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE=y

# Keep DrySpool, Wi-Fi, device certificate and Memfault UART commands.
# Shed generic SDK diagnostics from the space-constrained setup profile.
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_SHELL_HELP=n
CONFIG_SHELL_HISTORY=n
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_CBPRINTF_FP_SUPPORT=n

# Home Wi-Fi setup does not carry enterprise certificate blobs over Bluetooth.
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_ENTERPRISE=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_WEP=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_AUTHORIZATION_CUSTOM=y
CONFIG_BT_L2CAP_TX_MTU=147
CONFIG_BT_BUF_ACL_RX_SIZE=151
CONFIG_BT_BUF_ACL_TX_SIZE=151
CONFIG_BT_RX_STACK_SIZE=10240
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=75
CONFIG_WIFI_PROV_CORE=y
CONFIG_BT_WIFI_PROV=y
CONFIG_BT_WIFI_PROV_LOG_LEVEL_WRN=y
CONFIG_NANOPB=y
CONFIG_NRF70_SR_COEX=y
CONFIG_NRF70_SR_COEX_RF_SWITCH=y
