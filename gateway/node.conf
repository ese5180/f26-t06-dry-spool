CONFIG_DRYSPOOL_NODE=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_SHELL=y
CONFIG_BT_DEVICE_NAME="DrySpool A"
CONFIG_BT_CENTRAL=n
CONFIG_BT_GATT_CLIENT=n
CONFIG_IMG_MANAGER=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=3072
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH=y
CONFIG_NORDIC_QSPI_NOR=y

# A and B report their own identities and heartbeat metrics through G.
CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_NCS_DEVICE_ID_HW_ID=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_HW_VERSION="dryspool-box-a"
CONFIG_MEMFAULT_NCS_FW_TYPE="dryspool-box-a"
CONFIG_MEMFAULT_NCS_IMPLEMENT_METRICS_COLLECTION=n
CONFIG_MEMFAULT_METRICS_HEARTBEAT_INTERVAL_SECS=300
CONFIG_MEMFAULT_MCUMGR_GRP=y
CONFIG_MEMFAULT_SHELL=y
CONFIG_REBOOT=y
CONFIG_MCUMGR_GRP_IMG_VERSION_CMP_USE_BUILD_NUMBER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--custom-tlv 0x00a0 dryspool-box-a"
