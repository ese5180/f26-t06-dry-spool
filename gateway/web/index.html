<!doctype html>
<html lang="en-US">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#163b34">
<title>DrySpool · Device dashboard</title>
<style>
:root{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;color:#19372f;background:#f2f4ee;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}body{margin:0}header{background:#163b34;color:white}header div,main{max-width:980px;margin:auto;padding:22px clamp(16px,4vw,40px)}header div{font-weight:720;font-size:20px;letter-spacing:.01em}.brand{display:inline-block;width:17px;height:17px;border:5px double #c3df8e;border-radius:50%;vertical-align:-1px;margin-right:10px}
h1{font-size:clamp(27px,5vw,39px);letter-spacing:-.04em;margin:14px 0 22px}h2,h3,p{margin:0}h2{font-size:24px}h3{font-size:15px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
article,form{background:#fff;border:1px solid #d4ddd1;border-radius:18px;padding:clamp(16px,3vw,24px)}form{max-width:440px}form label,input{display:block}input{border:1px solid #839b8d;border-radius:8px;padding:11px;font:inherit;width:100%;margin:10px 0}
.top,.row,.controls{display:flex;align-items:center;justify-content:space-between;gap:8px}.state{background:#eef1eb;color:#4c6055;font-size:13px;border-radius:20px;padding:5px 10px}.state.live{background:#e3f2d5;color:#34551c}.device,time,.status{font-size:13px;color:#506658}.device{margin:3px 0 20px;font-family:ui-monospace,monospace}
.mass{background:#eff4e7;border-radius:12px;padding:15px 18px}.mass span,.env span{display:block;font-size:14px}.mass strong{font-size:clamp(38px,6vw,52px);line-height:1.3}.env{display:flex;padding:16px 0;gap:12px;border-bottom:1px solid #e1e7dd}.env div{flex:1}.env b{font-size:24px}small{font-size:14px;font-weight:500;margin-left:4px}.row{margin:18px 0 10px}.mode{font-size:14px}
button{background:#f7f8f5;color:#26483d;border:1px solid #a7b7aa;border-radius:9px;padding:10px;font:inherit;font-size:15px;min-height:44px;cursor:pointer}.controls button{flex:1}.controls button[aria-pressed=true],form button{color:white;background:#254c3e}.controls button:disabled{cursor:default;opacity:.55}.status{min-height:20px;margin:10px 0}time{display:block;border-top:1px solid #e1e7dd;padding-top:10px}#notice{margin-bottom:10px;color:#853920}button:focus-visible,input:focus-visible{outline:3px solid #417a46;outline-offset:2px}[hidden]{display:none!important}
</style>
<header><div><i class="brand" aria-hidden="true"></i>DrySpool</div></header>
<main><h1>Device dashboard</h1><p id="notice" role="status"></p>
<form hidden><label for="code">Enter the pairing code shown in the gateway terminal.</label><input id="code" required autocorrect="off" autocapitalize="none" spellcheck="false" autocomplete="off"><button>Connect to dashboard</button></form>
<section id="cards" aria-label="Devices"></section>
<template><article><div class="top"><h2></h2><span class="state"></span></div><p class="device"></p>
<div class="mass"><span>Filament remaining</span><strong data-field="grams">—</strong><small>g</small></div>
<div class="env"><div><span>Temperature</span><b data-field="temperature">—</b><small>°C</small></div><div><span>Relative humidity</span><b data-field="humidity">—</b><small>% RH</small></div></div>
<div class="row"><h3>Fan controls</h3><span class="mode"></span></div><div class="controls"><button data-mode="on">On</button><button data-mode="off">Off</button><button data-mode="auto">Auto</button></div>
<p class="status" role="status"></p><time></time></article></template></main>
<script>
const form = document.querySelector("form"), notice = document.querySelector("#notice");
const names = {on:"Manual on",off:"Manual off",auto:"Auto"};
const cards = new Map();
let timer, refreshVersion = 0;
async function api(path, body) {
  const opts = body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {};
  const response = await fetch(path,{...opts,cache:"no-store",signal:typeof AbortSignal.timeout==="function" ? AbortSignal.timeout(25000) : undefined});
  const result = await response.json();
  if (!response.ok) {
    const error = new Error(result.error || "Connection failed. Try again.");
    error.status = response.status;
    throw error;
  }
  return result;
}
function makeCard(slot) {
  const el = document.querySelector("template").content.firstElementChild.cloneNode(true);
  el.querySelector("h2").textContent = "DrySpool " + slot;
  document.querySelector("#cards").append(el);
  const card = {el, data:{}, sending:false, waiting:null, message:""};
  for (const button of el.querySelectorAll("button")) {
    button.onclick = async () => {
      card.sending = true;
      card.message = "";
      render(card);
      try {
        const result = await api("/api/"+slot+"/fan",{mode:button.dataset.mode});
        card.waiting = {id:result.request,mode:button.dataset.mode,at:Date.now()};
      } catch(e) { card.message = e.message; }
      finally { card.sending = false; render(card); refresh(); }
    };
  }
  cards.set(slot, card);
  return card;
}
function render(card) {
  const {el,data:d} = card;
  const age = Date.now() - d.ts;
  const fresh = d.ts > 0 && age >= -10000 && age <= (d.control ? 45000 : 120000);
  const state = el.querySelector(".state");
  state.textContent = d.error ? "Read failed" : !d.ts ? "Awaiting data" : fresh ? "Recent report" : "Stale reading";
  state.classList.toggle("live", Boolean(fresh && !d.error));
  el.querySelector(".device").textContent = d.device || "";
  for (const field of el.querySelectorAll("[data-field]")) {
    const key = field.dataset.field;
    field.textContent = Number.isFinite(d[key]) ? d[key].toLocaleString("en-US",{maximumFractionDigits:key==="grams"?0:1}) : "—";
  }
  el.querySelector("time").textContent = d.ts ? "Last sample · "+new Date(d.ts).toLocaleString("en-US",{hour12:false}) : "Waiting for a sample";
  el.querySelector(".mode").textContent = names[d.mode] || "Unknown mode";
  const w = card.waiting;
  if (w && d.request === w.id && d.mode === w.mode && d.control) {
    card.message = "Box confirmed · "+names[w.mode]; card.waiting = null;
  } else if (w && Date.now()-w.at > 30000) {
    card.message = "No confirmation from the box yet."; card.waiting = null;
  }
  const text = d.error || (card.sending ? "Sending…" : card.waiting ? "Command sent. Waiting for confirmation." :
    d.pending ? "Pending · "+(names[d.desired] || "") :
    card.message || (d.fan == null ? "Fan output unknown" : "Fan output · "+(d.fan?"On":"Off")));
  el.querySelector(".status").textContent = !d.error && d.ts && !d.control && !d.mode ? "Readings only. Waiting for control firmware to report." : text;
  for (const button of el.querySelectorAll("button")) {
    button.disabled = !fresh || !d.control || !!d.error || card.sending || !!card.waiting;
    button.setAttribute("aria-pressed",String(d.mode===button.dataset.mode));
  }
}
async function refresh() {
  clearTimeout(timer);
  const version = ++refreshVersion;
  try {
    const data = await api("/api/devices");
    if (version !== refreshVersion) return;
    form.hidden = true; notice.textContent = "";
    document.querySelector("#cards").hidden = false;
    for (const d of data) {
      if (Number.isFinite(d.ageMs)) d.ts = d.ageMs < 0 ? 0 : Date.now()-d.ageMs;
      const card = cards.get(d.slot) || makeCard(d.slot);
      card.data = d; render(card);
    }
  } catch(e) {
    if (version !== refreshVersion) return;
    if (e.status===401) {
      form.hidden=false; document.querySelector("#cards").hidden=true; return;
    }
    notice.textContent="Lost connection to the dashboard. Retrying…";
    for (const card of cards.values()) {card.data.error="Disconnected";render(card);}
  }
  if (version===refreshVersion) timer=setTimeout(refresh,5000);
}
form.onsubmit=async e=>{
  e.preventDefault();
  try {await api("/api/pair",{code:document.querySelector("#code").value.trim()});refresh();}
  catch(err){notice.textContent=err.message;}
};
refresh();
</script>
</html>
